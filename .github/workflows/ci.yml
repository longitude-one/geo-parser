name: PHP CI

on:
    schedule:
        - cron: '0 17 * * 5'
    push:
        paths-ignore:
            - '**.md'
            - 'LICENSE'
    pull_request:
        paths-ignore:
            - '**.md'
            - 'LICENSE'

permissions:
    contents: read
    pull-requests: read

jobs:
    ci_decision:
        name: Decide whether to run the full CI
        runs-on: ubuntu-latest
        outputs:
            run_full_ci: ${{ steps.decision.outputs.run_full_ci }}
        steps:
            - id: decision
              uses: actions/github-script@v8
              with:
                  script: |
                      if (context.eventName !== 'push') {
                          core.setOutput('run_full_ci', 'true');
                          return;
                      }

                      const branch = context.ref.replace(/^refs\/heads\//, '');
                      const pullRequests = await github.paginate(
                          github.rest.pulls.list,
                          {
                              ...context.repo,
                              head: `${context.repo.owner}:${branch}`,
                              state: 'open',
                              per_page: 100,
                          },
                      );
                      const hasOpenPullRequest = pullRequests.length > 0;

                      core.info(
                          hasOpenPullRequest
                              ? `Skipping this push: ${branch} already has an open pull request.`
                              : `Running CI for the push to ${branch}.`,
                      );
                      core.setOutput('run_full_ci', hasOpenPullRequest ? 'false' : 'true');

    stable-build:
        needs: ci_decision
        if: needs.ci_decision.outputs.run_full_ci == 'true'
        runs-on: ubuntu-latest
        name: PHP 8.3 - Doctrine Lexer 3.0
        env:
            HAS_CC_SECRET: ${{secrets.CODECOV_TOKEN != '' }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Validate composer.json
              run: composer validate --strict

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ format('{0}-composer-{1}', runner.os, hashFiles('composer.json', 'quality/php-cs-fixer/composer.json', 'quality/php-mess-detector/composer.json', 'quality/php-stan/composer.json')) }}
                  restore-keys: |
                      ${{ format('{0}-composer-', runner.os) }}

            - name: Set up PHP 8.3
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  coverage: pcov
                  tools: composer:v2

            - name: Install dependencies
              run: composer update -vvv

            - name: List libraries
              run: composer show

            - name: Run test suite and with coverage for PHP 8.3
              run: |
                composer run-script test
                cat .phpunit.cache/coverage-results.txt

            - name: Upload coverage to CodeCov
              if: ${{ env.HAS_CC_SECRET == 'true' }}
              uses: codecov/codecov-action@v7
              with:
                token: ${{ secrets.CODECOV_TOKEN }}
                files: .phpunit.cache/coverage.xml
                slug: longitude-one/geo-parser


            ## Quality checks
            ## PHP-CS-Fixer
            - name: Install PHP-CS-Fixer
              run: composer update --working-dir=quality/php-cs-fixer

            - name: Run PHP-CS-Fixer
              run: ./quality/php-cs-fixer/vendor/bin/php-cs-fixer fix --config=quality/php-cs-fixer/.php-cs-fixer.php --dry-run --allow-risky=yes

            ## PHP-MESS-DETECTOR
            - name: Install PHP-MESS-DETECTOR
              run: composer update --working-dir=quality/php-mess-detector
            - name: Run PHP-MESS-DETECTOR on lib directory
              run: ./quality/php-mess-detector/vendor/bin/phpmd lib text quality/php-mess-detector/ruleset.xml
            - name: Run PHP-MESS-DETECTOR on tests directory
              run: ./quality/php-mess-detector/vendor/bin/phpmd tests text quality/php-mess-detector/test-ruleset.xml

            ## PHP-STAN
            - name: Install PHP-STAN
              run: composer update --working-dir=quality/php-stan
            - name: Run PHP-STAN
              run: ./quality/php-stan/vendor/bin/phpstan analyse --configuration=quality/php-stan/php-stan.neon lib tests --error-format=table --no-progress --no-interaction --no-ansi --level=9 --memory-limit=256M -v
    next-version-build:
        needs: stable-build
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ '8.4', '8.5' ]
                lexer: [ '3.0' ] # Preserve the matrix because 3.1 is incoming
                exclude:
                    # Already tested
                    - php: '8.3'
                      lexer: '3.0'

        name: PHP ${{ matrix.php }} - Doctrine Lexer ${{ matrix.lexer }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer packages
              id: composer-cache-old
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ format('{0}-php-{1}-lexer-{2}-{3}', runner.os, matrix.php, matrix.lexer, hashFiles('composer.json')) }}
                  restore-keys: ${{ format('{0}-php-{1}-lexer-{2}-', runner.os, matrix.php, matrix.lexer) }}
            - name: Set up PHP ${{ matrix.php }}
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2

            - name: Install dependencies and force lexer ${{ matrix.lexer }}
              run: composer --prefer-source require doctrine/lexer:^${{ matrix.lexer }}

            - name: Show libraries
              run: composer show

            - name: Run tests for forks or version without code coverage
              run: vendor/bin/phpunit
    dev-version-build:
        needs: stable-build
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ '8.3', '8.4', '8.5']
                lexer: ['3.1.x-dev', '4.0.x-dev']
                exclude:
                    # No compatibilities
                    - php: '8.3'
                      lexer: '4.0.x-dev'
        name: PHP ${{ matrix.php }} - Doctrine Lexer ${{ matrix.lexer }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer packages
              id: composer-cache-x-dev
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ format('{0}-php-{1}-lexer-{2}-{3}', runner.os, matrix.php, matrix.lexer, hashFiles('composer.json')) }}
                  restore-keys: ${{ format('{0}-php-{1}-lexer-{2}-', runner.os, matrix.php, matrix.lexer) }}
            - name: Set up PHP ${{ matrix.php }}
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2

            - name: Install dependencies and force lexer ${{ matrix.lexer }}
              run: composer --prefer-source require doctrine/lexer:${{ matrix.lexer }}

            - name: Show libraries
              run: composer show

            - name: Run tests for forks or version without code coverage
              run: vendor/bin/phpunit
